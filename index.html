<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>梨花小院 · 江南建筑实时预览</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <canvas id="world"></canvas>
  <canvas id="snap-grid" hidden aria-hidden="true"></canvas>
  <header>
    <p class="eyebrow">梨花小院 · LIVE ARCHITECTURE REVIEW</p>
    <h1>江南建筑构件 · 实时预览</h1>
    <p id="subtitle">院门 / 侧门 / 灰白院墙</p>
  </header>
  <nav aria-label="预览控制">
    <button data-view="gate-courtyard-front">院门正面</button>
    <button data-view="gate-courtyard-45">院门 45°</button>
    <button data-view="gate-side-front">侧门正面</button>
    <button data-view="gate-side-45">侧门 45°</button>
    <button id="authoring-toggle">拖动部件</button>
    <button id="silhouette">Silhouette</button>
    <button id="wall-candidate">历史墙色 B</button>
  </nav>
  <aside id="authoring-panel" hidden aria-label="部件编辑">
    <strong>侧门部件 Gizmo</strong>
    <label>部件
      <select id="part-select"></select>
    </label>
    <div class="offset-grid">
      <label>X <input id="offset-x" type="number" step="0.05" min="-3" max="3" value="0"></label>
      <label>Y <input id="offset-y" type="number" step="0.025" min="-3" max="3" value="0"></label>
      <label>Z <input id="offset-z" type="number" step="0.05" min="-3" max="3" value="0"></label>
    </div>
    <div class="snap-controls">
      <button id="snap-toggle" type="button" class="active">网格吸附：开</button>
      <span id="snap-readout">X/Z 5cm · Y 2.5cm</span>
    </div>
    <div class="authoring-actions">
      <button id="reset-part" type="button">复位当前</button>
      <button id="reset-all" type="button">全部复位</button>
    </div>
    <p>拖动 X / Y / Z 轴会吸附网格。Alt 临时切到 1cm 精细吸附，Shift 临时切到 25cm 粗吸附；关闭吸附后可自由拖动。拖空白处仍可旋转镜头。</p>
  </aside>
  <div id="transform-gizmo" hidden aria-label="三轴移动 Gizmo">
    <button type="button" class="gizmo-axis gizmo-x" data-axis="x" aria-label="沿 X 轴拖动"><span>X</span></button>
    <button type="button" class="gizmo-axis gizmo-y" data-axis="y" aria-label="沿 Y 轴拖动"><span>Y</span></button>
    <button type="button" class="gizmo-axis gizmo-z" data-axis="z" aria-label="沿 Z 轴拖动"><span>Z</span></button>
    <i class="gizmo-origin" aria-hidden="true"></i>
  </div>
  <aside id="legend">
    <div><span>院门</span><b>普通竖向拼板 · 双扇</b></div>
    <div><span>侧门</span><b>白墙中的单扇侧门</b></div>
    <div><span>门板</span><b>中浅灰褐旧木色</b></div>
    <div><span>院墙</span><b>灰白墙身 · 深灰瓦帽</b></div>
  </aside>
  <pre id="metrics"></pre>
  <div id="fatal" hidden></div>
  <script src="kit/deterministic-random.js"></script>
  <script src="kit/style/jiangnan-v1.js"></script>
  <script src="kit/geometry/geometry-sink.js"></script>
  <script src="kit/geometry/profiles.js"></script>
  <script src="kit/geometry/elements.js"></script>
  <script src="kit/components/roof.js"></script>
  <script src="kit/components/lattice-facade-unit.js"></script>
  <script src="kit/components/plank-door.js"></script>
  <script src="kit/components/gate-frame.js"></script>
  <script src="kit/components/wall-segment.js"></script>
  <script src="kit/assemblies/courtyard-wall.js"></script>
  <script src="kit/assemblies/courtyard-gate.js"></script>
  <script src="kit/assemblies/side-gate.js"></script>
  <script src="kit/architecture-schema.js"></script>
  <script src="kit/architecture-kit.js"></script>
  <script src="preview-runtime.js"></script>
  <script src="preview-grid.js"></script>
  <script src="preview-scale.js"></script>
  <script src="preview-export.js"></script>
  <script>
    JiangnanPreview.setVariant('gate-stage');
    JiangnanPreview.setView('gate-courtyard-45');
  </script>
</body>
</html>
