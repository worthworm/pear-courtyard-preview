<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>梨花小院 · 江南建筑实时预览</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <canvas id="world"></canvas>
  <header>
    <p class="eyebrow">梨花小院 · LIVE ARCHITECTURE REVIEW</p>
    <h1>江南建筑构件 · Checkpoint B · B-R007</h1>
    <p id="subtitle">双扇木板院门 / 双扇木板侧门 / 灰白院墙</p>
  </header>
  <nav aria-label="预览控制">
    <button data-view="gate-courtyard-front">院门正面</button>
    <button data-view="gate-courtyard-45">院门 45°</button>
    <button data-view="gate-side-front">侧门正面</button>
    <button data-view="gate-side-45">侧门 45°</button>
    <button id="silhouette">Silhouette</button>
    <button id="wall-candidate">历史墙色 B</button>
  </nav>
  <aside id="legend">
    <div><span>院门</span><b>普通竖向拼板 · 双扇</b></div>
    <div><span>侧门</span><b>普通竖向拼板 · 双扇</b></div>
    <div><span>门板</span><b>中浅灰褐旧木色</b></div>
    <div><span>院墙</span><b>灰白墙身 · 深灰瓦帽</b></div>
  </aside>
  <pre id="metrics"></pre>
  <div id="fatal" hidden></div>
  <script src="kit/deterministic-random.js"></script>
  <script src="kit/style/jiangnan-v1.js"></script>
  <script src="kit/geometry/geometry-sink.js"></script>
  <script src="kit/geometry/profiles.js"></script>
  <script src="kit/geometry/elements.js"></script>
  <script src="kit/components/roof.js"></script>
  <script src="kit/components/lattice-facade-unit.js"></script>
  <script src="kit/components/plank-door.js"></script>
  <script src="kit/components/gate-frame.js"></script>
  <script src="kit/components/wall-segment.js"></script>
  <script src="kit/assemblies/courtyard-wall.js"></script>
  <script src="kit/assemblies/courtyard-gate.js"></script>
  <script src="kit/assemblies/side-gate.js"></script>
  <script src="kit/architecture-schema.js"></script>
  <script src="kit/architecture-kit.js"></script>
  <script src="preview-runtime.js"></script>
  <script>
    JiangnanPreview.setVariant('gate-stage');
    JiangnanPreview.setView('gate-courtyard-45');
  </script>
</body>
</html>
